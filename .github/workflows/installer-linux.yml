name: Linux installer

# Native x86_64 Linux installer, including Steam Deck in Desktop Mode.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to, e.g. v0.9.1
        required: true
  pull_request:
    paths: ['installer/**', '.github/workflows/installer-linux.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && (github.event.release.tag_name || inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Test and vet
        working-directory: installer
        run: |
          go test ./...
          go vet ./...
      - name: Build Linux installer
        working-directory: installer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.buildVersion=${TAG#v}" -o ../CargoEarthSetup-linux-x86_64 .
      - name: Smoke test
        run: ./CargoEarthSetup-linux-x86_64 -help
      - name: Attach to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" CargoEarthSetup-linux-x86_64 --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: CargoEarthSetup-linux-x86_64
          path: CargoEarthSetup-linux-x86_64

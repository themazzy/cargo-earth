name: Windows installer

# Builds CargoEarthSetup.exe and attaches it to each published release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to, e.g. v0.8.6
        required: true
  pull_request:
    paths: ['installer/**', '.github/workflows/installer.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Vet
        working-directory: installer
        run: go vet ./...
      - name: Build CargoEarthSetup.exe
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.buildVersion=${TAG#v}" -o ../CargoEarthSetup.exe .
      - name: Attach to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" CargoEarthSetup.exe --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: CargoEarthSetup
          path: CargoEarthSetup.exe
